name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: bastardkb/bastardkb-qmk
      # PINNED — do not move this to a moving branch.
      # bkb-master-archive (frozen 2025-08-10) is the archived bkb-master
      # branch and contains the classic base `bastardkb/skeletyl` board —
      # the ORIGINAL splinktegrated (built-in controller, Oct/Nov 2025 era):
      # "Skeletyl Splinky", pid 0x1830, dev 2.0.0, matrix cols GP28/GP21/GP6/
      # GP7/GP8, rows GP26/GP5/GP4/GP9, ws2812 GP0, MASTER_RIGHT, and the
      # 1-wire vendor serial driver on GP1.
      # Bastardkb main restructured this board into splinktegrated_rev1
      # (same 1-wire GP1 scheme — compatible) and splinktegrated_rev3
      # (USART full-duplex, TX GP1 / RX GP12 — electrically different, NOT
      # compatible with this build). Pinning to the commit SHA makes every
      # build byte-identical to the archived "old" firmware, no moving
      # target. To update deliberately: point to a new commit SHA and verify
      # the board definition still matches the target splinktegrated rev1
      # (vendor serial, pin GP1).
      qmk_ref: 8f3b92fff27e6356120913a4ec6b21a017d0fef6

  publish:
    name: 'Publish firmware release'
    if: always() && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Firmware

      # Guard: fail loudly if the expected firmware is not produced. This
      # protects against silent board/keymap drift (e.g. someone repointing
      # qmk_ref to a branch whose artifact is named differently) — we never
      # want to release firmware for the wrong controller.
      - name: Verify expected firmware artifact
        run: |
          ls -la
          test -n "$(find . -maxdepth 2 -name 'bastardkb_skeletyl_shur3d.uf2' -print -quit)" \
            || { echo "ERROR: expected bastardkb_skeletyl_shur3d.uf2 not found"; exit 1; }

      # Each build gets its own immutable release+tag; old releases/tags are
      # never deleted (the shared qmk publish workflow replaces the "latest"
      # release and wipes history — that is why releases are created here).
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: "QMK Firmware ${{ github.sha }}"
          tag_name: firmware-${{ github.sha }}
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          files: |
            **/*.hex
            **/*.bin
            **/*.uf2
